services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: website_growth
      POSTGRES_USER: website_growth
      POSTGRES_PASSWORD: website_growth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://website_growth:website_growth@postgres:5432/website_growth
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_ENDPOINT: http://minio:9000
      WEB_BASE_URL: http://localhost:3000
      ALLOW_PRIVATE_URLS: "false"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
